name: Score archived social observations
on: workflow_dispatch
permissions:
  contents: read
jobs:
  score:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Read archived datasets and calculate social scores
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/recover_scores.py evidence/2026-11-21
      - uses: actions/upload-artifact@v4
        with:
          name: archived-social-scores
          path: scores.json
