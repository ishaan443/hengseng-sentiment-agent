name: Live collection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[live]'
      - name: Collect ten days of observations
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          hengseng collect --preflight
          hengseng collect
      - name: Generate a report when prices and observations are available
        if: ${{ !cancelled() && hashFiles('data/live/prices.csv') != '' && hashFiles('data/live/posts.jsonl') != '' }}
        run: hengseng run
      - name: Prepare aggregate run results
        if: ${{ !cancelled() && hashFiles('data/live/collection.json') != '' }}
        run: python scripts/export_summary.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('public-results/coverage.json') != '' }}
        with:
          name: live-market-summary
          path: public-results/
          retention-days: 14
